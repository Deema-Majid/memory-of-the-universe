<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ذاكرة الكون</title>
<link rel="icon" href="assets/logo/logo_icon.png">
<link rel="stylesheet" href="css/style.css?v=202611240004">
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="1600" height="900"></canvas>
  <div id="menu" class="screen"></div>
  <div id="worlds" class="screen hidden"></div>
  <div id="stages" class="screen hidden"></div>
  <div id="profile" class="screen hidden"></div>
  <div id="book" class="screen hidden"></div>
  <div id="team" class="screen hidden"></div>
  <div id="hud" class="hidden">
    <div id="topbar">
      <button class="ib" id="bBack"><img src="assets/ui/back.png" alt="رجوع"></button>
      <div id="title"></div>
      <div id="chips"></div>
      <div id="energy"></div>
      <button class="ib" id="bSound"><img src="assets/ui/sound_on.png" alt="الصوت"></button>
      <button class="ib" id="bHint"><img src="assets/ui/hint.png" alt="تلميح"></button>
      <button class="ib" id="bPause"><img src="assets/ui/pause.png" alt="إيقاف"></button>
    </div>
    <div id="goal"></div>
    <div id="padL" class="pad"><div class="pk" data-k="l"><span>◀</span></div><div class="pk" data-k="r"><span>▶</span></div><i class="knob"></i></div>
    <div id="padR" class="pad"><button id="pG" class="pb small"><span>▼</span><small></small></button><button id="pJ" class="pb"><span>▲</span><small></small></button></div>
    <div id="panel"></div>
    <div id="controls"><div id="sliders"></div><div id="btns"><button class="btn" id="bTest">جرّبي</button><button class="btn pri" id="bDeduce">ثبّتي الاستنتاج</button><button class="btn pri" id="bAct">نفّذي</button></div></div>
  </div>
  <div id="modal" class="hidden"></div>
  <div id="toast"></div>
  <div id="rotate">أدِيري الجهاز بالوضع الأفقي 📱↺</div>
</div></div>
<script src="js/util.js?v=202611240004"></script>
<script src="js/data.js?v=202611240004"></script>
<script src="js/game.js?v=202611240004"></script>
<script src="js/ui.js?v=202611240004"></script>
<script src="js/net.js?v=202611240004"></script>
</body>
</html>
